<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CamWeb</title>

  <style>
    /* ---- Tipografía ---------------------------------------------------------------
       Las fuentes van dentro de la propia web (assets/web/fonts) para no depender de
       Internet. Son "variables": un solo fichero contiene todos los grosores (wght).
         - Plus Jakarta Sans -> textos de la interfaz.
         - JetBrains Mono    -> datos técnicos: horas, IPs, identificadores.
       ------------------------------------------------------------------------------- */
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("fonts/PlusJakartaSans-latin-variable.woff2") format("woff2");
      font-weight: 200 800;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-latin-variable.woff2") format("woff2");
      font-weight: 100 800;
      font-display: swap;
    }

    /* ---- Colores (claro / oscuro) ------------------------------------------------
       Tema claro: paleta A1 "Verde azulado" (fondo hueso cálido + acento verde azulado).
       El tema oscuro de abajo es provisional: sus colores se elegirán más adelante.
       ------------------------------------------------------------------------------- */
    :root {
      --bg:           #f6f5f1;   /* fondo general, hueso cálido                     */
      --surface:      #ffffff;   /* tarjetas y cabecera                             */
      --text:         #1e2329;   /* texto principal                                 */
      --text-soft:    #5b6470;   /* texto secundario (contraste 5,9:1 sobre blanco) */
      --wall:         #3f4752;   /* paredes del plano                               */
      --room:         #ece9e1;   /* habitación en reposo                            */
      --room-hover:   #d4ece8;   /* habitación al pasar el ratón / con foco         */
      --room-active:  #0f766e;   /* habitación al pulsarla                          */
      --accent:       #0f766e;   /* color de marca: enlaces, botones principales    */
      --accent-hover: #0b5a54;
      --border:       #e4e1d8;
      --live:         #b3400b;   /* estado "en directo"                             */
      --ok:           #15803d;   /* estado "conectado"                              */

      --font-ui:     "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono:   "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          #15181d;
        --surface:     #1f232a;
        --text:        #e8eaee;
        --text-soft:   #9aa1ad;
        --wall:        #c3c8d1;
        --room:        #2a2f38;
        --room-hover:  #233a5c;
        --room-active: #4b8ff8;
        --accent:      #4b8ff8;
        --border:      #333944;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }

    main { max-width: 480px; margin: 0 auto; padding: 16px; }

    .hint { color: var(--text-soft); font-size: .9rem; margin: 0 0 12px; }

    /* ---- Plano -------------------------------------------------------------------- */
    #plan { width: 100%; height: auto; display: block; }

    .room {
      fill: var(--room);
      stroke: var(--wall);
      stroke-width: 6;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill .15s;
      outline: none;
    }
    .room:hover, .room:focus { fill: var(--room-hover); }
    .room:active             { fill: var(--room-active); }

    .room-label {
      fill: var(--text);
      font-size: 22px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;   /* el clic atraviesa el texto y llega a la habitación */
    }

    /* ---- Vista de habitación ------------------------------------------------------ */
    .back {
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;             /* tamaño mínimo cómodo para el dedo */
      padding: 0 12px 0 4px;
    }
    .back:hover { color: var(--accent-hover); background: var(--bg); }

    .device-list { list-style: none; margin: 0; padding: 0; }
    .device-list li {
      background: var(--surface);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-weight: 600;
      /* sombra suave en lugar de borde: separa la tarjeta del fondo sin "encajonarla" */
      box-shadow: 0 1px 2px rgba(30, 35, 41, .06), 0 4px 12px rgba(30, 35, 41, .04);
    }

    .empty {
      text-align: center;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 32px 16px;
    }

    /* Botones y campos no heredan la fuente por defecto: se la pasamos */
    button, input, select, textarea { font: inherit; }

    .mono { font-family: var(--font-mono); }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header>
    <button id="back" class="back" hidden>&larr; Plano</button>
    <h1 id="title">Mi casa</h1>
  </header>

  <main>
    <!-- Vista 1: el plano -->
    <section id="view-plan">
      <p class="hint">Toca una habitación para ver sus cámaras y dispositivos.</p>
      <svg id="plan" viewBox="-10 0 590 1460" role="group" aria-label="Plano de la casa"></svg>
    </section>

    <!-- Vista 2: los dispositivos de una habitación -->
    <section id="view-room" hidden>
      <ul id="devices" class="device-list"></ul>
      <p id="no-devices" class="empty" hidden>Todavía no hay cámaras ni dispositivos en esta habitación.</p>
    </section>
  </main>

  <script>
    /* ==================================================================================
       DATOS
       Cada habitación tiene:
         id       -> identificador corto (se usa en la URL)
         name     -> nombre que se muestra
         points   -> esquinas del polígono en el plano (unidades del viewBox del SVG)
         label    -> dónde se pinta el nombre [x, y, rotación]
         devices  -> lista de cámaras/dispositivos (de momento vacía)

       Más adelante esta lista vendrá del servidor C++ (API REST) en vez de estar aquí.
       ================================================================================== */
    const ROOMS = [
      { id: "salon",       name: "Salón",
        points: [[125,50],[342,50],[342,130],[558,130],[558,550],[200,550],[200,460],[125,460]],
        label: [330, 330, 0],   devices: [] },

      { id: "terraza",     name: "Terraza",
        points: [[342,10],[558,10],[558,130],[342,130]],
        label: [450, 70, 0],    devices: [] },

      { id: "dormitorio1", name: "Dormitorio 1",
        points: [[200,550],[465,550],[465,820],[200,820]],
        label: [332, 685, 0],   devices: [] },

      { id: "pasillo",     name: "Pasillo",
        points: [[465,550],[558,550],[558,1020],[465,1020]],
        label: [511, 785, -90], devices: [] },

      { id: "bano",        name: "Baño",
        points: [[267,820],[465,820],[465,1020],[267,1020]],
        label: [366, 920, 0],   devices: [] },

      { id: "cocina",      name: "Cocina",
        points: [[267,1020],[558,1020],[558,1445],[267,1445]],
        label: [412, 1232, 0],  devices: [] },

      { id: "dormitorio2", name: "Dormitorio 2",
        points: [[13,1210],[267,1210],[267,1445],[13,1445]],
        label: [140, 1327, 0],  devices: [] },
    ];

    /* ==================================================================================
       DIBUJAR EL PLANO
       Creamos un <polygon> y un <text> por habitación dentro del <svg>.
       ================================================================================== */
    const SVG_NS = "http://www.w3.org/2000/svg";
    const plan   = document.getElementById("plan");

    function drawPlan() {
      for (const room of ROOMS) {
        const poly = document.createElementNS(SVG_NS, "polygon");
        poly.setAttribute("points", room.points.map(p => p.join(",")).join(" "));
        poly.setAttribute("class", "room");
        poly.setAttribute("tabindex", "0");          // navegable con teclado
        poly.setAttribute("role", "button");
        poly.setAttribute("aria-label", room.name);

        poly.addEventListener("click", () => openRoom(room.id));
        poly.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRoom(room.id); }
        });

        const [x, y, rot] = room.label;
        const text = document.createElementNS(SVG_NS, "text");
        text.setAttribute("x", x);
        text.setAttribute("y", y);
        text.setAttribute("class", "room-label");
        if (rot) text.setAttribute("transform", `rotate(${rot} ${x} ${y})`);
        text.textContent = room.name;

        plan.append(poly, text);
      }
    }

    /* ==================================================================================
       NAVEGACIÓN
       Usamos el "hash" de la URL (#/habitacion/salon). Así:
         - el botón Atrás del navegador/móvil funciona solo,
         - el servidor C++ no necesita saber nada: siempre sirve este mismo index.html.
       ================================================================================== */
    function openRoom(id) { location.hash = "#/habitacion/" + id; }

    function render() {
      const match = location.hash.match(/^#\/habitacion\/(\w+)$/);
      const room  = match && ROOMS.find(r => r.id === match[1]);

      document.getElementById("view-plan").hidden = !!room;
      document.getElementById("view-room").hidden = !room;
      document.getElementById("back").hidden      = !room;
      document.getElementById("title").textContent = room ? room.name : "Mi casa";

      if (room) renderDevices(room);
    }

    function renderDevices(room) {
      const list = document.getElementById("devices");
      list.innerHTML = "";

      for (const dev of room.devices) {
        const li = document.createElement("li");
        li.textContent = dev.name;
        list.appendChild(li);
      }

      document.getElementById("no-devices").hidden = room.devices.length > 0;
    }

    document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
    window.addEventListener("hashchange", render);

    drawPlan();
    render();
  </script>
</body>
</html>
